{{- range .Values.models }}
---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.modelsNamespace }}
  annotations:
    openshift.io/display-name: {{ .displayName | default (.name | replace "-" " " | title) }}
    opendatahub.io/model-type: generative
    opendatahub.io/genai-use-case: {{ .useCase | default "code-assistant" }}
    {{-  with .hardwareProfile }}
    {{- if .enabled }}
    opendatahub.io/hardware-profile-name: {{ .name }}
    opendatahub.io/hardware-profile-namespace: {{ .namespace }}
    {{- end }}
    {{- end }}
  labels:
    {{- include "maas-pulse.labels" $ | nindent 4 }}
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
spec:
  model:
    name: {{ .name }}
    uri: {{ .uri }}
  replicas: {{ .replicas | default 1 }}
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
    {{- if $.Values.epp.enabled }}
    {{- $w := $.Values.epp.weights }}
    scheduler:
      template:
        containers:
          # Only args is overridden. The pool name, ports and TLS flags live in
          # the preset's command, which is left alone; args carries just
          # --config-text, so replacing it cannot drop startup flags.
          - name: main
            args:
              - --config-text
              - |
                apiVersion: llm-d.ai/v1alpha1
                kind: EndpointPickerConfig
                plugins:
                - type: single-profile-handler
                - type: queue-scorer
                - type: kv-cache-utilization-scorer
                - type: prefix-cache-scorer
                - type: no-hit-lru-scorer
                - type: max-score-picker
                - parameters:
                    scheme: https
                  type: metrics-data-source
                schedulingProfiles:
                - name: default
                  plugins:
                  - pluginRef: queue-scorer
                    weight: {{ $w.queueScorer }}
                  - pluginRef: kv-cache-utilization-scorer
                    weight: {{ $w.kvCacheUtilizationScorer }}
                  - pluginRef: prefix-cache-scorer
                    weight: {{ $w.prefixCacheScorer }}
                  - pluginRef: no-hit-lru-scorer
                    weight: {{ $w.noHitLruScorer }}
                  - pluginRef: max-score-picker
    {{- else }}
    scheduler: {}
    {{- end }}
  template:
    containers:
      - name: main
        image: {{ .image | default $.Values.defaultServingImage }}
        command:
          {{- if .command }}
          {{- toYaml .command | nindent 10 }}
          {{- else }}
          - python
          - -m
          - vllm.entrypoints.openai.api_server
          {{- end }}
        args:
          - "--served-model-name={{ `{{.Name}}` }}"
          - --model=/mnt/models
          - --enable-ssl-refresh
          - --ssl-certfile=/var/run/kserve/tls/tls.crt
          - --ssl-keyfile=/var/run/kserve/tls/tls.key
          - --enable-force-include-usage
          {{- with .extraArgs }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- with .env }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
        resources:
          {{- toYaml .resources | nindent 10 }}
        volumeMounts:
          - mountPath: /dev/shm
            name: shm
    {{- with .nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 2Gi
        name: shm
{{- end }}
