{{- range .Values.externalModels }}
{{- $safeName := .name | replace "." "-" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $safeName }}-api-key
  namespace: {{ $.Values.modelsNamespace }}
  labels:
    {{- include "maas-pulse.labels" $ | nindent 4 }}
    inference.llm-d.ai/ipp-managed: "true"
type: Opaque
data:
  api-key: {{ .apiKey | default "CHANGEME" | b64enc }}
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata:
  name: {{ $safeName }}-provider
  namespace: {{ $.Values.modelsNamespace }}
  labels:
    {{- include "maas-pulse.labels" $ | nindent 4 }}
spec:
  provider: {{ .provider }}
  endpoint: {{ .endpoint }}
  auth:
    type: {{ .authType | default "apikey" }}
    secretRef:
      name: {{ $safeName }}-api-key
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.modelsNamespace }}
  labels:
    {{- include "maas-pulse.labels" $ | nindent 4 }}
spec:
  externalProviderRefs:
  - ref:
      name: {{ $safeName }}-provider
    targetModel: {{ .targetModel }}
    apiFormat: {{ .apiFormat | default "openai-chat" }}
    path: {{ .path | default "/v1/chat/completions" }}
    weight: {{ .weight | default 100 }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.modelsNamespace }}
  labels:
    {{- include "maas-pulse.labels" $ | nindent 4 }}
spec:
  modelRef:
    kind: ExternalModel
    name: {{ .name }}
{{- end }}
