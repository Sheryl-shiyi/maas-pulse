{{- if and .Values.externalModels .Values.externalProviderIdleTimeout }}
{{/*
The gateway reaches external providers through the cluster's AWS NAT gateway, which
silently drops a TCP flow after 350 seconds of inactivity and answers any later packet
on it with a reset. Envoy keeps idle upstream connections pooled for an hour by default,
so after a quiet spell every pooled connection to a provider is dead, and the next
requests to reuse them fail at once with
`503 UC upstream_reset_before_response_started{connection_termination}`. Measured: after
420 seconds idle, 10 of 10 concurrent calls failed this way; after 180 seconds they did
not.

Closing idle connections before the NAT forgets them removes the failure. The setting
belongs on the provider's DestinationRule, but that rule is generated by the RHOAI
external-provider reconciler and the ExternalProvider CRD exposes no connection setting.
The reconciler creates the rule and does not correct drift, so a patch sticks until the
ExternalProvider is recreated, which a model rename does. Hence a job on every install
and upgrade, the same arrangement as the PodMonitor interval.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patch-external-provider-idle-timeout
  namespace: {{ .Values.modelsNamespace }}
  labels:
    {{- include "maas-pulse.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patch-external-provider-idle-timeout
  namespace: {{ .Values.modelsNamespace }}
  labels:
    {{- include "maas-pulse.labels" . | nindent 4 }}
rules:
- apiGroups: ["networking.istio.io"]
  resources: ["destinationrules"]
  verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patch-external-provider-idle-timeout
  namespace: {{ .Values.modelsNamespace }}
  labels:
    {{- include "maas-pulse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patch-external-provider-idle-timeout
subjects:
  - kind: ServiceAccount
    name: patch-external-provider-idle-timeout
    namespace: {{ .Values.modelsNamespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: patch-external-provider-idle-timeout
  namespace: {{ .Values.modelsNamespace }}
  labels:
    {{- include "maas-pulse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccount: patch-external-provider-idle-timeout
      serviceAccountName: patch-external-provider-idle-timeout
      restartPolicy: Never
      containers:
      - name: patch
        image: {{ .Values.global.toolsImage }}
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -ec
        - |
          # The reconciler creates each rule shortly after its ExternalProvider. Wait for
          # all of them, but do not fail the release over an idle timeout.
          providers="{{- range .Values.externalModels }}{{- if and . .name }} {{ .name | replace "." "-" }}-provider{{- end }}{{- end }}"
          for p in $providers; do
            for attempt in $(seq 1 30); do
              oc get destinationrule "$p" -n {{ .Values.modelsNamespace }} >/dev/null 2>&1 && break
              sleep 10
            done
            if ! oc get destinationrule "$p" -n {{ .Values.modelsNamespace }} >/dev/null 2>&1; then
              echo "no DestinationRule $p appeared; leaving it alone"
              continue
            fi
            echo "setting connectionPool.http.idleTimeout={{ .Values.externalProviderIdleTimeout }} on $p"
            oc patch destinationrule "$p" -n {{ .Values.modelsNamespace }} --type merge \
              -p '{"spec":{"trafficPolicy":{"connectionPool":{"http":{"idleTimeout":"{{ .Values.externalProviderIdleTimeout }}"}}}}}'
          done
{{- end }}
