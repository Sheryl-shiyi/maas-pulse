{{- if .Values.trafficUI.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-pulse-ui
  namespace: {{ include "maas-pulse.uiNamespace" . }}
  labels:
    app.kubernetes.io/component: traffic-ui
    {{- include "maas-pulse.uiLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.trafficUI.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: maas-pulse-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maas-pulse-ui
        app.kubernetes.io/component: traffic-ui
      {{- if .Values.trafficUI.apiKeys }}
      annotations:
        # Roll the pods when the API keys change, so new keys take effect on upgrade.
        checksum/api-keys: {{ .Values.trafficUI.apiKeys | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: maas-pulse-ui
      containers:
        - name: ui
          image: {{ .Values.trafficUI.image }}
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: PORT
              value: "8080"
            - name: MAAS_GATEWAY_URL
              value: {{ .Values.trafficUI.maasGatewayUrl | default (printf "https://maas.%s" .Values.global.wildcardDomain) | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.trafficUI.prometheusUrl | default "https://thanos-querier.openshift-monitoring.svc:9091" | quote }}
            - name: MODEL_NAMES
              value: {{ .Values.trafficUI.modelNames | default "" | quote }}
            - name: MODEL_DISPLAY_NAMES
              value: {{ .Values.trafficUI.modelDisplayNames | default "" | quote }}
            - name: MODEL_TYPES
              value: {{ .Values.trafficUI.modelTypes | default "" | quote }}
            - name: USER_NAMES
              value: {{ .Values.trafficUI.userNames | default "admin,user1,user2,user3,user4,user5" | quote }}
            - name: USER_DISPLAY_NAMES
              value: {{ .Values.trafficUI.userDisplayNames | default "" | quote }}
            - name: USER_RATE_LIMITS
              value: {{ .Values.trafficUI.userRateLimits | default "" | quote }}
            - name: USER_GROUPS
              value: {{ .Values.trafficUI.userGroups | default "" | quote }}
            - name: USER_SERVICE_ACCOUNTS
              value: {{ .Values.trafficUI.userServiceAccounts | default "" | quote }}
            - name: USER_TIERS
              value: {{ .Values.trafficUI.userTiers | default "" | quote }}
            - name: SUBSCRIPTION_NAMESPACE
              value: {{ .Values.trafficUI.subscriptionNamespace | default "models-as-a-service" | quote }}
            - name: MODELS_NAMESPACE
              value: {{ .Values.modelsNamespace | default "llm" | quote }}
            {{- $apiKeysSecret := .Values.trafficUI.apiKeysSecret }}
            {{- if .Values.trafficUI.apiKeys }}
            {{- $apiKeysSecret = "maas-pulse-ui-apikeys" }}
            {{- end }}
            {{- if $apiKeysSecret }}
            - name: USER_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ $apiKeysSecret }}
                  key: api-keys
            {{- end }}
            {{- if .Values.autoscaling.enabled }}
            {{- $scaleNames := list }}
            {{- range .Values.autoscaling.models }}
            {{- $scaleNames = append $scaleNames .name }}
            {{- end }}
            - name: AUTOSCALE_MODELS
              value: {{ $scaleNames | join "," | quote }}
            - name: AUTOSCALE_MAX_REPLICAS
              value: {{ (index .Values.autoscaling.models 0).maxReplicas | default 2 | quote }}
            - name: AUTOSCALE_COOLDOWN
              value: {{ .Values.autoscaling.cooldownSeconds | default 60 | quote }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerUrl | default (printf "https://keycloak.%s/realms/maas" .Values.global.wildcardDomain) | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | default "maas-oidc" | quote }}
            - name: OIDC_REDIRECT_URI
              value: {{ printf "https://pulse.%s/auth/callback" .Values.global.wildcardDomain | quote }}
            - name: OIDC_MODEL_SERVED
              value: {{ .Values.trafficUI.oidcModelServed | default "qwen3-8b-fp8" | quote }}
            - name: OIDC_MODEL_PATH
              value: {{ .Values.trafficUI.oidcModelPath | default "qwen3-8b-fp8" | quote }}
            {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/config
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}
