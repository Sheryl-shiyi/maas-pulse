{{- if .Values.trafficUI.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-pulse-ui
  labels:
    app.kubernetes.io/name: maas-pulse-ui
    {{- include "maas-pulse.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maas-pulse-ui-monitoring
  labels:
    app.kubernetes.io/name: maas-pulse-ui
    {{- include "maas-pulse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: maas-pulse-ui
    namespace: {{ .Release.Namespace }}
{{- end }}
