{{- if .Values.trafficUI.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-pulse-ui
  namespace: {{ include "maas-pulse.uiNamespace" . }}
  labels:
    {{- include "maas-pulse.uiLabels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maas-pulse-ui-monitoring
  labels:
    {{- include "maas-pulse.uiLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: maas-pulse-ui
    namespace: {{ include "maas-pulse.uiNamespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-pulse-ui-subscription-reader
  namespace: {{ .Values.trafficUI.subscriptionNamespace | default "models-as-a-service" }}
  labels:
    {{- include "maas-pulse.uiLabels" . | nindent 4 }}
rules:
  - apiGroups: ["maas.opendatahub.io"]
    resources: ["maassubscriptions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-pulse-ui-subscription-reader
  namespace: {{ .Values.trafficUI.subscriptionNamespace | default "models-as-a-service" }}
  labels:
    {{- include "maas-pulse.uiLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-pulse-ui-subscription-reader
subjects:
  - kind: ServiceAccount
    name: maas-pulse-ui
    namespace: {{ include "maas-pulse.uiNamespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-pulse-ui-deployment-reader
  namespace: {{ .Values.modelsNamespace | default "llm" }}
  labels:
    {{- include "maas-pulse.uiLabels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-pulse-ui-deployment-reader
  namespace: {{ .Values.modelsNamespace | default "llm" }}
  labels:
    {{- include "maas-pulse.uiLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-pulse-ui-deployment-reader
subjects:
  - kind: ServiceAccount
    name: maas-pulse-ui
    namespace: {{ include "maas-pulse.uiNamespace" . }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-pulse-ui-autoscaler
  namespace: {{ .Values.modelsNamespace | default "llm" }}
  labels:
    {{- include "maas-pulse.uiLabels" . | nindent 4 }}
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["llminferenceservices"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-pulse-ui-autoscaler
  namespace: {{ .Values.modelsNamespace | default "llm" }}
  labels:
    {{- include "maas-pulse.uiLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-pulse-ui-autoscaler
subjects:
  - kind: ServiceAccount
    name: maas-pulse-ui
    namespace: {{ include "maas-pulse.uiNamespace" . }}
{{- end }}
{{- end }}
