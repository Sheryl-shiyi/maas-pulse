{{- if and .Values.trafficUI.enabled .Values.trafficUI.apiKeys }}
apiVersion: v1
kind: Secret
metadata:
  name: maas-pulse-ui-apikeys
  labels:
    app.kubernetes.io/name: maas-pulse-ui
    app.kubernetes.io/component: traffic-ui
    {{- include "maas-pulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-keys: {{ .Values.trafficUI.apiKeys | quote }}
{{- end }}
