apiVersion: extensions.kuadrant.io/v1alpha1
kind: TelemetryPolicy
metadata:
  name: maas-telemetry
  namespace: openshift-ingress
  labels:
    {{- include "maas-pulse.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: maas-observability
spec:
  metrics:
    default:
      labels:
        model: responseBodyJSON("/model")
        # Kubernetes fixes a ServiceAccount's username as
        # system:serviceaccount:maas-tier-free:user1. Shortened here to free:user1, the name
        # the traffic view uses, and the label RHOAI's own dashboard reads too. Only
        # startsWith/replace, and a fallback for every other identity (admin, OIDC users),
        # because on RHCL 1.4 a label that fails to evaluate holds every response open.
        user: 'auth.identity.userid.startsWith("system:serviceaccount:maas-tier-") ? auth.identity.userid.replace("system:serviceaccount:maas-tier-", "") : auth.identity.userid'
        subscription: auth.identity.selected_subscription
        # Every label must resolve for every identity. organization_id and cost_center
        # read subscription_info fields no subscription sets, and from RHCL 1.4 the wasm
        # shim treats the unresolved key as a failed task and holds every response open,
        # internal models included. Nothing read either label.
        # RHCL 1.4.4 also does not propagate edits to this policy into the gateway; to
        # change the labels, delete the policy and let the next upgrade recreate it.
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway
