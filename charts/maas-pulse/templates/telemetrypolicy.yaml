apiVersion: extensions.kuadrant.io/v1alpha1
kind: TelemetryPolicy
metadata:
  name: maas-telemetry
  namespace: openshift-ingress
  labels:
    {{- include "maas-pulse.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: maas-observability
spec:
  metrics:
    default:
      labels:
        model: responseBodyJSON("/model")
        user: auth.identity.userid
        subscription: auth.identity.selected_subscription
        # Every label must resolve for every identity. organization_id and cost_center
        # read subscription_info fields no subscription sets, and from RHCL 1.4 the wasm
        # shim treats the unresolved key as a failed task and holds every response open,
        # internal models included. Nothing read either label.
        # RHCL 1.4.4 also does not propagate edits to this policy into the gateway; to
        # change the labels, delete the policy and let the next upgrade recreate it.
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway
