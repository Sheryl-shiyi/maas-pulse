{{- range $name, $sub := .Values.subscriptions }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: {{ $name }}
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: {{ $sub.displayName | default (title $name) }}
  labels:
    {{- include "maas-pulse.labels" $ | nindent 4 }}
spec:
  modelRefs:
  {{- range $model, $rateLimit := $sub.tokenRateLimits }}
  - name: {{ $model }}
    namespace: {{ $.Values.modelsNamespace }}
    {{- with $rateLimit }}
    tokenRateLimits:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- /* A tier owns the built-in group of its ServiceAccount namespace, so the
         subscription owns a real group and the dashboard editor can save it. */}}
  {{- $groups := $sub.groups | default list }}
  {{- if $sub.serviceAccountNamespace }}
  {{- $groups = append $groups (dict "name" (printf "system:serviceaccounts:%s" $sub.serviceAccountNamespace)) }}
  {{- end }}
  {{- with $groups }}
  owner:
    groups:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  priority: {{ $sub.priority | default 0 }}
{{- end }}
