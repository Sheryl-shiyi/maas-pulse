{{- range $name, $sub := .Values.subscriptions }}
{{- $groups := $sub.groups | default list }}
{{- if $sub.serviceAccountNamespace }}
{{- $groups = append $groups (dict "name" (printf "system:serviceaccounts:%s" $sub.serviceAccountNamespace)) }}
{{- end }}
{{- if $groups }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: {{ $name }}-policy
  namespace: models-as-a-service
  annotations:
    openshift.io/description: Auth policy created for subscription "{{ $name }}"
  labels:
    {{- include "maas-pulse.labels" $ | nindent 4 }}
spec:
  modelRefs:
  {{- range $model, $rateLimits := $sub.tokenRateLimits }}
  - name: {{ $model }}
    namespace: {{ $.Values.modelsNamespace }}
  {{- end }}
  subjects:
    groups:
      {{- toYaml $groups | nindent 6 }}
{{- end }}
{{- end }}
