{{- if .Values.oidc.enabled }}
{{- $modelsNs := .Values.modelsNamespace }}
{{- $models := .Values.oidc.modelAccess }}
{{- $labels := include "maas-pulse.labels" . }}
{{- range .Values.oidc.groups }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: oidc-{{ .name }}-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "OIDC {{ .displayName }} Access"
    openshift.io/description: "Grants {{ .name }} OIDC group access to MaaS models"
  labels:
    {{- $labels | nindent 4 }}
spec:
  modelRefs:
  {{- range $models }}
  - name: {{ . }}
    namespace: {{ $modelsNs }}
  {{- end }}
  subjects:
    groups:
      - name: {{ .name }}
    users: []
{{- end }}
{{- end }}
