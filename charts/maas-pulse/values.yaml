global:
  wildcardDomain: apps.cluster.example.com
  wildcardCertName: router-certs-default
  toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest

users:
  - user1
  - user2
  - user3
  - user4
  - user5

subscriptions:
  # Tiers named after consumer plans an audience already understands, so that raising
  # or lowering one in the dashboard needs no explanation. Each tier owns a namespace;
  # the ServiceAccounts inside it are the tier's members, and the built-in group
  # `system:serviceaccounts:<namespace>` is what the subscription owns.
  #
  # The ladder is deliberately steep: Free has to hit its ceiling within seconds of the
  # traffic starting, or the audience never sees throttling happen.
  free:
    displayName: Free tier
    priority: 10
    serviceAccountNamespace: maas-tier-free
    serviceAccounts: [user1, user2, user3]
    tokenRateLimits:
      nemotron-3-nano-30b-a3b:
        - limit: 1000
          window: 1m
      qwen3-8b-fp8:
        - limit: 1000
          window: 1m
      # The two external models are billed per token to the user's own keys (OpenAI;
      # Gemini since 2026-11-05), so their limits are far below the self-hosted models'
      # in every tier, and the same for both: the tier limit is what caps the bill if a
      # run is left going.
      "gemini-3.1-flash-lite":
        - limit: 1000
          window: 1m
      "gpt-5.4-nano":
        - limit: 1000
          window: 1m
  pro:
    displayName: Pro tier
    priority: 20
    serviceAccountNamespace: maas-tier-pro
    serviceAccounts: [user4, user5, user6]
    tokenRateLimits:
      nemotron-3-nano-30b-a3b:
        - limit: 10000
          window: 1m
      qwen3-8b-fp8:
        - limit: 10000
          window: 1m
      "gemini-3.1-flash-lite":
        - limit: 5000
          window: 1m
      "gpt-5.4-nano":
        - limit: 5000
          window: 1m
  max:
    # Sized for long-context work rather than chat. A 1500-token prompt at the
    # generator's 4/s cap spread over three users is already 120k tokens/min, and the
    # point of this tier is that it does not hit a ceiling during a demo.
    displayName: Max tier
    priority: 30
    serviceAccountNamespace: maas-tier-max
    serviceAccounts: [user7, user8, user9]
    tokenRateLimits:
      nemotron-3-nano-30b-a3b:
        - limit: 800000
          window: 1m
      qwen3-8b-fp8:
        - limit: 800000
          window: 1m
      "gemini-3.1-flash-lite":
        - limit: 20000
          window: 1m
      "gpt-5.4-nano":
        - limit: 20000
          window: 1m
  admin:
    displayName: MaaS Admins
    groups:
      - name: admin
    tokenRateLimits:
      nemotron-3-nano-30b-a3b:
        - limit: 100000
          window: 1m
      qwen3-8b-fp8:
        - limit: 100000
          window: 1m
      "gemini-3.1-flash-lite":
        - limit: 100000
          window: 1m
      "gpt-5.4-nano":
        - limit: 100000
          window: 1m
  user:
    displayName: MaaS Users
    groups:
      - name: user
    tokenRateLimits:
      nemotron-3-nano-30b-a3b:
        - limit: 5000
          window: 1m
      qwen3-8b-fp8:
        - limit: 5000
          window: 1m
      "gemini-3.1-flash-lite":
        - limit: 5000
          window: 1m
      "gpt-5.4-nano":
        - limit: 5000
          window: 1m

modelsNamespace: llm

monitoring:
  # How often Prometheus scrapes the vLLM pods. KServe's generated PodMonitors set no
  # interval, so they inherit the cluster default of 30s — long enough that the UI,
  # which polls every 3s, shows the same figures ten times and then jumps. At 5s the
  # queue depth and batch size visibly climb instead. Measured: over a 60s window, 13
  # samples held 9-11 distinct values at 5s against 3 at the default.
  #
  # The cost is six times the samples from these pods only. Set to null to leave
  # whatever KServe generated alone.
  vllmScrapeInterval: 5s

# TCP keepalive on the gateway's connections to external providers, in seconds. The AWS
# NAT gateway drops a flow idle for 350s; without probes, a pooled connection died there
# and the next request on it got a 503. `time` must stay well below 350. Applied as an
# EnvoyFilter (templates/envoyfilter-external-keepalive.yaml). Set to null to disable.
# Add `x-maas-upstream: <ip:port>` to every gateway response: the vLLM pod that served an
# internal request, so the traffic UI can show llm-d's routing per request.
upstreamHeader:
  enabled: true

externalProviderKeepalive:
  time: 60
  interval: 30
  probes: 3

# Authorino validates every ServiceAccount token with a TokenReview, and one replica
# rate limits itself doing it: ~30% of calls rejected at 4 requests/s, ~52% at 8/s.
# Three replicas removed it completely. Applied by a post-install hook because the
# Authorino CR belongs to the Kuadrant operator and Kuadrant exposes no setting for it.
# Set to null to leave the operator's default alone.
authorino:
  replicas: 3

# vLLM runtime for both internal models: RHAIIS 3.5.2, which is vLLM 0.24.0 and the
# same image (by digest) that RHOAI 3.5.2's v3-5-2 workload template uses. It is set
# here rather than taken from that template because each LLMInferenceService pins the
# template set it first saw, so an RHOAI upgrade alone never moves the runtime: this
# cluster ran 3.4.0 (vLLM 0.18) for weeks after reaching RHOAI 3.5. A model can
# override it with its own `image:`.
defaultServingImage: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.2

# llm-d Endpoint Picker (EPP) scheduling profile.
#
# Why this is set explicitly rather than left to the cluster's preset: KServe does
# not recreate a healthy EPP, so a cluster upgraded from RHOAI 3.4 keeps the 3.4
# default profile — queue-scorer 2 and prefix-cache-scorer 3, nothing else. Under
# that profile a freshly scaled-up replica has an empty prefix cache and loses
# every scoring round, which is the replica starvation that RHOAI 3.5 added
# no-hit-lru-scorer to fix. Rendering the profile here makes it independent of
# whichever preset the cluster happens to carry.
#
# Deliberately NOT done: switching to the v3-5-0-* presets. Those introduce 12
# named HTTPRoute rules, and with more than one model on the same gateway Istio
# treats the identical names as duplicates and collapses all traffic onto a
# single EPP (RHOAIENG-93709, no workaround, upstream istio#61601). Overriding
# only the scheduler args leaves route generation untouched.
#
# Weights are relative, not normalised. Raising prefixCacheScorer favours cache
# reuse over even load; raising noHitLruScorer favours spreading onto cold
# replicas.
#
# These are the RHOAI 3.5 defaults except for queueScorer, raised from 2 to 4. With the
# defaults, prefix cache affinity at weight 3 outranked queue depth at 2 under overload:
# on 2026-10-16 a replica sat with 280 requests queued while a freshly added one had
# served 10 in its lifetime, because the warm replica kept winning on cache locality.
# Scaling up relieved nothing.
#
# Cache affinity should win while every replica is healthy — that is the whole point of
# the endpoint picker — and lose once one of them is backing up, which is precisely what
# queue depth measures. Putting queueScorer above prefixCacheScorer encodes that order.
# The right ratio depends on the workload; this is a demo default, not a universal one.
epp:
  enabled: true
  weights:
    queueScorer: 4
    kvCacheUtilizationScorer: 2
    prefixCacheScorer: 3
    noHitLruScorer: 2
models:
  - name: nemotron-3-nano-30b-a3b
    displayName: NVIDIA Nemotron 3 Nano 30B A3B FP8
    uri: oci://quay.io/jharmison/models:redhatai--nvidia-nemotron-3-nano-30b-a3b-fp8-modelcar
    # EXPERIMENT (T34 step 3), vLLM only; the platform stays RHOAI 3.5.2. RHAIIS
    # 3.6-fast2 (vLLM 0.26), by the digest the RHOAI 3.6 EA bundle references, because
    # 0.26 is the first vLLM that prefix-caches hybrid Mamba models like Nemotron and
    # can match prefixes finer than its 4176-token block. Unsupported on a 3.5 platform.
    image: registry.redhat.io/rhaii-fast/vllm-cuda-rhel9@sha256:97c7d6f66f3f0897b3ff10ddd135de930d45bdd116cf41a43e3ad7270029116a
    hardwareProfile:
      enabled: true
      name: gpu
      namespace: redhat-ods-applications
    resources:
      limits:
        cpu: "4"
        memory: 24Gi
        nvidia.com/gpu: "1"
      requests:
        cpu: "2"
        memory: 16Gi
        nvidia.com/gpu: "1"
    extraArgs:
      - --max-model-len=131072
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --trust-remote-code
      - --enable-force-include-usage
      - --reasoning-parser-plugin=/mnt/models/nano_v3_reasoning_parser.py
      - --reasoning-parser=nano_v3
      # Report usage.prompt_tokens_details.cached_tokens in each response: how much of
      # the prompt came from the prefix cache, per request, for the traffic UI.
      - --enable-prompt-tokens-details
      # Hybrid prefix caching (vLLM 0.26, PR #46384): save Mamba state at aligned
      # scheduler-step ends, and allow hits every 16 tokens (must divide the block size).
      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --prefix-match-unit=16
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-L40S
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists

  - name: qwen3-8b-fp8
    displayName: Qwen3 8B FP8 Dynamic
    uri: oci://registry.redhat.io/rhelai1/modelcar-qwen3-8b-fp8-dynamic:1.5
    hardwareProfile:
      enabled: true
      name: gpu
      namespace: redhat-ods-applications
    resources:
      limits:
        cpu: "4"
        memory: 20Gi
        nvidia.com/gpu: "1"
      requests:
        cpu: "2"
        memory: 12Gi
        nvidia.com/gpu: "1"
    extraArgs:
      - --max-model-len=40960
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      # Report usage.prompt_tokens_details.cached_tokens in each response: how much of
      # the prompt came from the prefix cache, per request, for the traffic UI.
      - --enable-prompt-tokens-details
      - --trust-remote-code
      - --enable-force-include-usage
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A10G
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists

# This default aligns with g6e.2xlarge instances
hardwareProfiles:
  gpu:
    node:
      tolerations:
        - key: nvidia.com/gpu
          effect: NoSchedule
          operator: Exists
    displayName: NVIDIA GPU
    cpu:
      min: 2
      max: 6
      default: 2
    memory:
      min: 2Gi
      max: 48Gi
      default: 16Gi
    gpu:
      nvidia.com/gpu:
        max: 1
        displayName: NVIDIA L40s

dashboardConfig:
  genAiStudio: true
  modelAsService: true
  maasAuthPolicies: true
  observabilityDashboard: true

modelRegistry:
  enabled: true
  registriesNamespace: rhoai-model-registries

clusterMonitoring:
  enabled: false
  config:
    enableUserWorkload: true
    prometheusK8s:
      retention: 168h
      volumeClaimTemplate:
        spec:
          volumeMode: Filesystem
          resources:
            requests:
              storage: 40Gi
  userConfig:
    prometheus:
      retention: 72h
      volumeClaimTemplate:
        spec:
          volumeMode: Filesystem
          resources:
            requests:
              storage: 40Gi

# Kuadrant sometimes misbehaves. Force a job to restart it after a delay post-apply
kuadrant:
  restart: false
  namespace: kuadrant-system

keycloak:
  enabled: false
  namespace: keycloak
  removeKubeAdmin: false

trafficUI:
  enabled: false
  # Namespace for the UI's own resources. The chart creates it. Leave empty to keep
  # them in the release namespace, which is where they used to live — but `default`
  # is hidden from the console's Topology view, so the UI could not be found there.
  namespace: maas-pulse
  image: quay.io/rh-ee-sherwang/maas-pulse:latest
  replicas: 1
  maasGatewayUrl: ""
  # Defaults to the in-cluster Thanos querier. Queries are authenticated with the
  # maas-pulse-ui service account token mounted in the pod (bound to
  # cluster-monitoring-view) — no separate token secret is needed.
  prometheusUrl: ""
  modelNames: "publishers/llm/models/nemotron-3-nano-30b-a3b,publishers/llm/models/qwen3-8b-fp8,gemini-3.1-flash-lite,gpt-5.4-nano"
  modelDisplayNames: "Nemotron 30B,Qwen3 8B,Gemini Flash,GPT-5.4 Nano"
  modelTypes: "internal,internal,external,external"
  # Extra request body fields per model, sent by the traffic generator, keyed by the
  # model name it sends.
  # Qwen3 thinks aloud by default: its answers began "<think> Okay, I need to…" and at
  # the generator's 100-token limit the live feed showed mostly reasoning. Its chat
  # template takes enable_thinking; the external backends would reject the field.
  # Nemotron reasons too, but its reasoning parser moves it out of the answer, so at 100
  # tokens the answer came back empty (finish_reason "length"); with thinking off the
  # whole budget goes to the answer.
  # (gpt-5-nano was tried with reasoning_effort: minimal and dropped: it still spent the
  # whole budget reasoning and returned empty, billed answers.)
  modelRequestParams:
    "publishers/llm/models/nemotron-3-nano-30b-a3b":
      chat_template_kwargs:
        enable_thinking: false
    "publishers/llm/models/qwen3-8b-fp8":
      chat_template_kwargs:
        enable_thinking: false
  # The demo cohort: one admin plus nine users spread across three subscription tiers.
  # Every list below is positional and must stay the same length and order.
  userNames: "admin,user1,user2,user3,user4,user5,user6,user7,user8,user9"
  # The same short names the metrics carry (see templates/telemetrypolicy.yaml), so the
  # traffic view, the chargeback view and RHOAI's dashboard all say free:user1.
  userDisplayNames: "admin,free:user1,free:user2,free:user3,pro:user4,pro:user5,pro:user6,max:user7,max:user8,max:user9"
  userRateLimits: "100k/min,1k/min,1k/min,1k/min,10k/min,10k/min,10k/min,800k/min,800k/min,800k/min"
  # Only used for users WITHOUT a ServiceAccount; for the rest the group is derived
  # from the SA namespace, so the subscription and the user list cannot disagree.
  userGroups: "admin,,,,,,,,,"
  # Which tier each user belongs to, used to band them in the topology view.
  userTiers: ",free,free,free,pro,pro,pro,max,max,max"
  # ServiceAccount backing each user, as namespace/name. A user with an entry here
  # authenticates with a minted token and needs no API key; admin is left blank so it
  # keeps using the API key path until that is migrated too.
  userServiceAccounts: ",maas-tier-free/user1,maas-tier-free/user2,maas-tier-free/user3,maas-tier-pro/user4,maas-tier-pro/user5,maas-tier-pro/user6,maas-tier-max/user7,maas-tier-max/user8,maas-tier-max/user9"
  subscriptionNamespace: "models-as-a-service"
  # MaaS API keys, comma-separated, in the same order as userNames. When set, the
  # chart creates the `maas-pulse-ui-apikeys` Secret itself — delete any manually
  # created Secret of that name first, or Helm will refuse to adopt it.
  # all-in-one.sh fills this in from user_keys.json (gitignored); never commit keys.
  apiKeys: ""
  # Alternative to apiKeys: reference a Secret you manage outside the chart,
  # with the keys in its `api-keys` field.
  apiKeysSecret: ""
  oidcModelServed: "qwen3-8b-fp8"
  oidcModelPath: "qwen3-8b-fp8"

oidc:
  enabled: false
  keycloakNamespace: keycloak
  clientId: maas-oidc
  # issuerUrl is auto-derived from global.wildcardDomain if left empty:
  #   https://keycloak.<wildcardDomain>/realms/maas
  # Override only if Keycloak uses a custom hostname.
  issuerUrl: ""
  ttl: 300
  # Models that OIDC groups can access (must match names in models/externalModels)
  modelAccess:
    - nemotron-3-nano-30b-a3b
    - qwen3-8b-fp8
    - gemini-3.1-flash-lite
    - gpt-5.4-nano
  users:
    - username: maas-user
      email: maas-user@example.com
      firstName: MaaS
      lastName: User
      password: maas-user
      groups:
        - data-scientists
        - ml-engineers
    - username: restricted-user
      email: restricted@example.com
      firstName: Restricted
      lastName: User
      password: restricted-user
      groups:
        - data-scientists
  groups:
    - name: data-scientists
      displayName: Data Scientists
      priority: 30
      modelRefs:
        - name: nemotron-3-nano-30b-a3b
          tokenRateLimits:
            - limit: 1000
              window: 1m
        - name: qwen3-8b-fp8
          tokenRateLimits:
            - limit: 1000
              window: 1m
        - name: gemini-3.1-flash-lite
          tokenRateLimits:
            - limit: 2000
              window: 1m
        - name: gpt-5.4-nano
          tokenRateLimits:
            - limit: 2000
              window: 1m
    - name: ml-engineers
      displayName: ML Engineers
      priority: 40
      modelRefs:
        - name: nemotron-3-nano-30b-a3b
          tokenRateLimits:
            - limit: 50000
              window: 1m
        - name: qwen3-8b-fp8
          tokenRateLimits:
            - limit: 50000
              window: 1m
        - name: gemini-3.1-flash-lite
          tokenRateLimits:
            - limit: 100000
              window: 1m
        - name: gpt-5.4-nano
          tokenRateLimits:
            - limit: 100000
              window: 1m

autoscaling:
  enabled: false
  cooldownSeconds: 900
  # Each model's range is bound by the GPUs actually waiting for it. The demo keeps one
  # spare A10G (the g5 MachineSet runs 2 nodes for 1 Qwen3 replica), so Qwen3 may go to
  # 2. Nemotron is not listed: there is no spare L40S, and a second replica would sit
  # Pending. Only Qwen3 scales, which keeps the demo to one extra GPU.
  models:
    - name: qwen3-8b-fp8
      minReplicas: 1
      maxReplicas: 2

# Provider API keys, by external model name. Kept apart from the list below because a
# `--set externalModels[0].apiKey=...` replaces the whole list with a one-field entry and
# deploys no external model at all. all-in-one.sh writes these into a temporary values file.
# A per-entry `apiKey` in the list still works and is used when no key is given here.
externalModelKeys: {}

externalModels:
  - name: gemini-3.1-flash-lite
    provider: openai
    endpoint: generativelanguage.googleapis.com
    targetModel: gemini-3.1-flash-lite
    apiFormat: openai-chat
    path: /v1beta/openai/chat/completions
    apiKey: REPLACE_WITH_YOUR_GEMINI_API_KEY

  - name: gpt-5.4-nano
    provider: openai
    endpoint: api.openai.com
    targetModel: gpt-5.4-nano
    apiFormat: openai-chat
    path: /v1/chat/completions
    apiKey: REPLACE_WITH_YOUR_OPENAI_API_KEY
