  wildcardCertName: router-certs-default
  toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest

users:
  - user1
  - user2
  - user3
  - user4
  - user5

subscriptions:
  admin:
    displayName: MaaS Admins
    groups:
      - name: admin
    tokenRateLimits:
      nemotron-3-nano-30b-a3b:
        - limit: 100000
          window: 1m
      qwen3-8b-fp8:
        - limit: 100000
          window: 1m
      "gemini-3.1-flash-lite":
        - limit: 100000
          window: 1m
      "gpt-4.1-nano":
        - limit: 100000
          window: 1m
  user:
    displayName: MaaS Users
    groups:
      - name: user
    tokenRateLimits:
      nemotron-3-nano-30b-a3b:
        - limit: 5000
          window: 1m
      qwen3-8b-fp8:
        - limit: 5000
          window: 1m
      "gemini-3.1-flash-lite":
        - limit: 5000
          window: 1m
      "gpt-4.1-nano":
        - limit: 5000
          window: 1m

modelsNamespace: llm
defaultServingImage: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.4.0

# llm-d Endpoint Picker (EPP) scheduling profile.
#
# Why this is set explicitly rather than left to the cluster's preset: KServe does
# not recreate a healthy EPP, so a cluster upgraded from RHOAI 3.4 keeps the 3.4
# default profile — queue-scorer 2 and prefix-cache-scorer 3, nothing else. Under
# that profile a freshly scaled-up replica has an empty prefix cache and loses
# every scoring round, which is the replica starvation that RHOAI 3.5 added
# no-hit-lru-scorer to fix. Rendering the profile here makes it independent of
# whichever preset the cluster happens to carry.
#
# Deliberately NOT done: switching to the v3-5-0-* presets. Those introduce 12
# named HTTPRoute rules, and with more than one model on the same gateway Istio
# treats the identical names as duplicates and collapses all traffic onto a
# single EPP (RHOAIENG-93709, no workaround, upstream istio#61601). Overriding
# only the scheduler args leaves route generation untouched.
#
# Weights are relative, not normalised. Raising prefixCacheScorer favours cache
# reuse over even load; raising noHitLruScorer favours spreading onto cold
# replicas. The defaults below are the RHOAI 3.5 defaults.
epp:
  enabled: true
  weights:
    queueScorer: 2
    kvCacheUtilizationScorer: 2
    prefixCacheScorer: 3
    noHitLruScorer: 2
models:
  - name: nemotron-3-nano-30b-a3b
    displayName: NVIDIA Nemotron 3 Nano 30B A3B FP8
    uri: oci://quay.io/jharmison/models:redhatai--nvidia-nemotron-3-nano-30b-a3b-fp8-modelcar
    hardwareProfile:
      enabled: true
      name: gpu
      namespace: redhat-ods-applications
    resources:
      limits:
        cpu: "4"
        memory: 24Gi
        nvidia.com/gpu: "1"
      requests:
        cpu: "2"
        memory: 16Gi
        nvidia.com/gpu: "1"
    extraArgs:
      - --max-model-len=131072
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --trust-remote-code
      - --enable-force-include-usage
      - --reasoning-parser-plugin=/mnt/models/nano_v3_reasoning_parser.py
      - --reasoning-parser=nano_v3
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-L40S
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists

  - name: qwen3-8b-fp8
    displayName: Qwen3 8B FP8 Dynamic
    uri: oci://registry.redhat.io/rhelai1/modelcar-qwen3-8b-fp8-dynamic:1.5
    hardwareProfile:
      enabled: true
      name: gpu
      namespace: redhat-ods-applications
    resources:
      limits:
        cpu: "4"
        memory: 20Gi
        nvidia.com/gpu: "1"
      requests:
        cpu: "2"
        memory: 12Gi
        nvidia.com/gpu: "1"
    extraArgs:
      - --max-model-len=40960
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      - --trust-remote-code
      - --enable-force-include-usage
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A10G
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists

# This default aligns with g6e.2xlarge instances
hardwareProfiles:
  gpu:
    node:
      tolerations:
        - key: nvidia.com/gpu
          effect: NoSchedule
          operator: Exists
    displayName: NVIDIA GPU
    cpu:
      min: 2
      max: 6
      default: 2
    memory:
      min: 2Gi
      max: 48Gi
      default: 16Gi
    gpu:
      nvidia.com/gpu:
        max: 1
        displayName: NVIDIA L40s

dashboardConfig:
  genAiStudio: true
  modelAsService: true
  maasAuthPolicies: true
  observabilityDashboard: true

modelRegistry:
  enabled: true
  registriesNamespace: rhoai-model-registries

clusterMonitoring:
  enabled: false
  config:
    enableUserWorkload: true
    prometheusK8s:
      retention: 168h
      volumeClaimTemplate:
        spec:
          volumeMode: Filesystem
          resources:
            requests:
              storage: 40Gi
  userConfig:
    prometheus:
      retention: 72h
      volumeClaimTemplate:
        spec:
          volumeMode: Filesystem
          resources:
            requests:
              storage: 40Gi

# Kuadrant sometimes misbehaves. Force a job to restart it after a delay post-apply
kuadrant:
  restart: false
  namespace: kuadrant-system

keycloak:
  enabled: false
  namespace: keycloak
  removeKubeAdmin: false

trafficUI:
  enabled: false
  image: quay.io/rh-ee-sherwang/maas-pulse:latest
  replicas: 1
  maasGatewayUrl: ""
  # Defaults to the in-cluster Thanos querier. Queries are authenticated with the
  # maas-pulse-ui service account token mounted in the pod (bound to
  # cluster-monitoring-view) — no separate token secret is needed.
  prometheusUrl: ""
  modelNames: "publishers/llm/models/nemotron-3-nano-30b-a3b,publishers/llm/models/qwen3-8b-fp8,gemini-3.1-flash-lite,gpt-4.1-nano"
  modelDisplayNames: "Nemotron 30B,Qwen3 8B,Gemini Flash,GPT-4.1 Nano"
  modelTypes: "internal,internal,external,external"
  userNames: "admin,user1,user2,user3,user4,user5"
  userDisplayNames: "VIP,user1,user2,user3,user4,user5"
  userRateLimits: "100k/min,5k/min,5k/min,5k/min,5k/min,5k/min"
  userGroups: "admin,user,user,user,user,user"
  subscriptionNamespace: "models-as-a-service"
  # MaaS API keys, comma-separated, in the same order as userNames. When set, the
  # chart creates the `maas-pulse-ui-apikeys` Secret itself — delete any manually
  # created Secret of that name first, or Helm will refuse to adopt it.
  # all-in-one.sh fills this in from user_keys.json (gitignored); never commit keys.
  apiKeys: ""
  # Alternative to apiKeys: reference a Secret you manage outside the chart,
  # with the keys in its `api-keys` field.
  apiKeysSecret: ""
  oidcModelServed: "qwen3-8b-fp8"
  oidcModelPath: "qwen3-8b-fp8"

oidc:
  enabled: false
  keycloakNamespace: keycloak
  clientId: maas-oidc
  # issuerUrl is auto-derived from global.wildcardDomain if left empty:
  #   https://keycloak.<wildcardDomain>/realms/maas
  # Override only if Keycloak uses a custom hostname.
  issuerUrl: ""
  ttl: 300
  # Models that OIDC groups can access (must match names in models/externalModels)
  modelAccess:
    - nemotron-3-nano-30b-a3b
    - qwen3-8b-fp8
    - gemini-3.1-flash-lite
    - gpt-4.1-nano
  users:
    - username: maas-user
      email: maas-user@example.com
      firstName: MaaS
      lastName: User
      password: maas-user
      groups:
        - data-scientists
        - ml-engineers
    - username: restricted-user
      email: restricted@example.com
      firstName: Restricted
      lastName: User
      password: restricted-user
      groups:
        - data-scientists
  groups:
    - name: data-scientists
      displayName: Data Scientists
      priority: 30
      modelRefs:
        - name: nemotron-3-nano-30b-a3b
          tokenRateLimits:
            - limit: 1000
              window: 1m
        - name: qwen3-8b-fp8
          tokenRateLimits:
            - limit: 1000
              window: 1m
        - name: gemini-3.1-flash-lite
          tokenRateLimits:
            - limit: 2000
              window: 1m
        - name: gpt-4.1-nano
          tokenRateLimits:
            - limit: 2000
              window: 1m
    - name: ml-engineers
      displayName: ML Engineers
      priority: 40
      modelRefs:
        - name: nemotron-3-nano-30b-a3b
          tokenRateLimits:
            - limit: 50000
              window: 1m
        - name: qwen3-8b-fp8
          tokenRateLimits:
            - limit: 50000
              window: 1m
        - name: gemini-3.1-flash-lite
          tokenRateLimits:
            - limit: 100000
              window: 1m
        - name: gpt-4.1-nano
          tokenRateLimits:
            - limit: 100000
              window: 1m

autoscaling:
  enabled: false
  cooldownSeconds: 900
  models:
    - name: qwen3-8b-fp8
      minReplicas: 1
      maxReplicas: 2

externalModels:
  - name: gemini-3.1-flash-lite
    provider: openai
    endpoint: generativelanguage.googleapis.com
    targetModel: gemini-3.1-flash-lite
    apiFormat: openai-chat
    path: /v1beta/openai/chat/completions
    apiKey: REPLACE_WITH_YOUR_GEMINI_API_KEY

  - name: gpt-4.1-nano
    provider: openai
    endpoint: api.openai.com
    targetModel: gpt-4.1-nano
    apiFormat: openai-chat
    path: /v1/chat/completions
    apiKey: REPLACE_WITH_YOUR_OPENAI_API_KEY
