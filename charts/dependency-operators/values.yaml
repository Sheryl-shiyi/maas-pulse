global:
  wildcardDomain: apps.cluster.example.com
  toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest

gateways:
  maasDefaultGateway:
    create: true
    useRoute: false
    hostname: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 2Gi

dataScienceClusterInitialization:
  monitoring:
    metrics:
      replicas: 1
      storage:
        retention: 90d
        size: 5Gi

dataScienceCluster:
  create: true
  components:
    dashboard:
      managementState: Managed
    kserve:
      modelsAsService:
        managementState: Managed
      managementState: Managed
    llamastackoperator:
      managementState: Managed

# used for MaaS
postgresCluster:
  create: true
  name: maas
  namespace: maas-db
  storage:
    size: 5Gi
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 256Mi

rhcl:
  create: true
  namespace: kuadrant-system

lws:
  create: true

install-operators:
  enabled: true
  operators:
    openshift-cert-manager-operator:
      enabled: true
      channel: stable-v1
      namespace: cert-manager-operator
      operatorGroup:
        enabled: true

    leader-worker-set:
      enabled: true
      channel: stable-v1.0
      namespace: openshift-lws-operator
      operatorGroup:
        enabled: true
      targetNamespaces:
        - openshift-lws-operator

    rhods-operator:
      enabled: true
      channel: stable-3.5
      namespace: redhat-ods-operator
      installPlanApproval: Manual
      startingCSV: rhods-operator.3.5.2
      operatorGroup:
        enabled: true

    # 1.4.4 is the first RHCL whose wasm shim (0.14.3) stops holding responses open when
    # it cannot read token usage: upstream errors and compressed bodies used to hang until
    # the client gave up. It is only in `stable-1.4`; the head of `stable` is 1.4.3,
    # which still has the bug. RHOAI 3.5 requires RHCL 1.4.x, and 1.3 is end of life.
    rhcl-operator:
      enabled: true
      channel: stable-1.4
      namespace: kuadrant-system
      installPlanApproval: Manual
      startingCSV: rhcl-operator.v1.4.4
      # RHOAIENG-71638: the gateway's wasm plugin gives Authorino 200ms to authenticate a
      # request and denies it on timeout, so a slow TokenReview under load becomes a 500
      # or 503 even with healthy models. 2s is the value in the RHOAI 3.5 known issue.
      config:
        env:
          - name: AUTH_SERVICE_TIMEOUT
            value: "2s"
      operatorGroup:
        enabled: true

    cloudnative-pg:
      enabled: true
      channel: stable-v1
      catalog: certified-operators
      namespace: cloudnative-pg
      operatorGroup:
        enabled: true

    rhbk-operator:
      enabled: true
      channel: stable-v26.4
      namespace: keycloak
      operatorGroup:
        enabled: true
      targetNamespaces:
        - keycloak

    cluster-observability-operator:
      enabled: true
      channel: stable
      namespace: openshift-cluster-observability-operator
      installPlanApproval: Manual
      startingCSV: cluster-observability-operator.v1.4.0
      operatorGroup:
        enabled: true

    opentelemetry-product:
      enabled: true
      channel: stable
      namespace: opentelemetry-operator
      operatorGroup:
        enabled: true
