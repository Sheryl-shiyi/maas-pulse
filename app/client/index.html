<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>maas-pulse — Real-Time Traffic Visualization</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; }
      .click-echo { position: fixed; width: 12px; height: 12px; margin: -6px 0 0 -6px; border: 2px solid #fff; border-radius: 50%; pointer-events: none; z-index: 1000; animation: clickEcho .45s ease-out forwards; }
      @keyframes clickEcho { from { transform: scale(0.5); opacity: .95; } to { transform: scale(5); opacity: 0; } }
      @keyframes traceFocus { 0% { box-shadow: 0 0 0 0 var(--c); } 100% { box-shadow: 0 0 0 14px rgba(0, 0, 0, 0); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
